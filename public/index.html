<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP test Player</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Navigation (Optional future expansion) -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-music"></i> MP test
            </div>
            <nav>
                <a href="#" class="active"><i class="fa-solid fa-house"></i> Home</a>
                <a href="#"><i class="fa-solid fa-fire"></i> Trending</a>
                <a href="#"><i class="fa-solid fa-heart"></i> Favorites</a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search for songs, artists, or paste YouTube link...">
                    <button id="searchBtn">Search</button>
                </div>
            </header>

            <div class="content-wrapper">
                <div id="loadingIndicator" class="hidden">
                    <div class="spinner"></div>
                    <p>Searching universe...</p>
                </div>

                <div id="resultsContainer" class="results-grid hidden">
                    <!-- Results will be injected here -->
                </div>
                
                <div id="welcomeState" class="welcome-state">
                    <i class="fa-solid fa-headphones-simple"></i>
                    <h2>Discover New Music</h2>
                    <p>Search for your favorite tracks or paste a link to start streaming in high quality.</p>
                </div>
            </div>
        </main>
        
        <!-- Right Queue Sidebar -->
        <aside class="queue-sidebar">
            <div class="queue-header">
                <h3><i class="fa-solid fa-list-ul"></i> Up Next</h3>
                <button id="clearQueueBtn" class="clear-btn">Clear</button>
            </div>
            <div id="queueList" class="queue-list">
                <!-- Queue items will be injected here -->
                <div class="empty-queue">
                    <p>Queue is empty.</p>
                    <p class="sub-text">Search and add songs to play next!</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Persistent Player -->
    <div class="player-bar" id="playerBar">
        <div class="track-info">
            <img id="playerThumb" src="https://via.placeholder.com/60" alt="Thumbnail" class="track-thumb">
            <div class="track-details">
                <h4 id="playerTitle">No track selected</h4>
                <p id="playerArtist">Search to play</p>
            </div>
        </div>
        
        <div class="player-controls-container">
            <div class="player-controls">
                <button class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="control-btn play-btn" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
                <button class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar-bg" id="progressBarBg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>
        
        <div class="volume-controls">
            <i class="fa-solid fa-volume-high"></i>
            <div class="volume-slider" id="volumeSlider">
                <div class="volume-fill" id="volumeFill"></div>
            </div>
        </div>
    </div>
    
    <audio id="audioPlayer" class="hidden"></audio>

    <script src="app.js"></script>
</body>
</html>
